# Hardening runtime untuk container (melengkapi Dockerfile.secure).
# Jalankan: docker compose up -d --build
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.secure
    image: devsecops-lab-p9:local
    container_name: p9-web
    ports:
      - "127.0.0.1:8080:8080"          # hanya listen di localhost host
    environment:
      APP_SECRET: ${APP_SECRET:-}      # [H-06] secret dari environment / file .env, bukan dari image
    read_only: true                    # [H-12] root filesystem read-only
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL                            # [H-13] buang semua Linux capability
    security_opt:
      - no-new-privileges:true         # [H-13] proses tidak bisa menaikkan privilege (setuid, dll)
    mem_limit: 256m                    # [H-14] batas resource supaya tidak bisa menghabiskan host
    cpus: 0.5
    pids_limit: 64
    restart: on-failure:3
