# Menjaga versi yang di-pin (digest base image, dependency Python, action SHA) tetap terbaru.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # Hanya update patch + digest. Naik minor Python (3.14 -> 3.15) diputuskan manual
    # karena path python3.14 dipakai di Dockerfile dan perlu diuji ulang.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: pip
    directory: /app
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
